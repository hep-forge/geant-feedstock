{% set versions = {
    "11.4.3": ""
} %}

{% set version = environ.get('COMMIT_VERSION', None) %}
{% set version = version or versions.keys()|first %}
{% set version = version|string %}

# Default (main label) "geant" is a proxy for conda-forge, nothing is
# compiled: the major picks the conda-forge package. conda-forge has no
# Geant3 package; add one here once it exists, or build Geant3 on its own
# branch/label. The EIC eAST-physics-list fork is built on the "eic" branch
# and published on the "eic" label (-c hep-forge/label/eic).
{% set cf_packages = {
    "11": "geant4",
    "10": "geant4"
} %}
{% set cf_package = cf_packages[version.split('.')[0]] %}
#
# Published as "1!<conda-forge version>": the epoch keeps it above the
# earlier "1!4.11.4.1" eAST upload still on the main label.
# Plain "#" comments only: the publish workflow's version trimming strips
# {% %}/{{ }} and yaml-loads the rest, so a Jinja comment block breaks it.
{% set _raw_version = environ.get('ANACONDA_VERSION', version) %}

{% set name = environ.get('ANACONDA_PACKAGE', 'geant')|string|lower %}

package:
  name: {{ name }}
  version: "1!{{ _raw_version|replace("-", ".") }}"

build:
  number: 0
  noarch: generic
  # Consumers link conda-forge's Geant4 libraries; give them its pin.
  # (Not pin_subpackage: it drops the epoch, see the eic branch recipe.)
  run_exports:
    - {{ cf_package }} >={{ version }},<{{ version.rsplit('.', 1)[0] }}.{{ version.rsplit('.', 1)[1]|int + 1 }}.0a0

requirements:
  run:
    - {{ cf_package }} {{ version }}.*
    # Geant4Config.cmake re-finds these with find_dependency(); conda-forge's
    # geant4 only brings the runtime libraries, so without the headers CMake
    # falls back to the system ones and rejects them (same list as the eic
    # branch recipe).
    - expat
    - zlib
    - freetype
    - xorg-libx11
    - xorg-libxmu
    - xorg-libxt
    - libgl-devel     # [linux]
    - libglu          # [linux]

test:
  requires:
    - geant4-examples {{ version }}.*   # conda-forge's geant4 ships no examples
    - cmake
    - make  # [unix]
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  commands:
    - test "$(geant4-config --version)" = "{{ version }}"
    - bash "${RECIPE_DIR}/test_geant4.sh"

about:
  home: "https://geant4.web.cern.ch"
  doc_url: "https://geant4.web.cern.ch/support"
  license: "LicenseRef-Geant4"
  summary: "Geant4 detector simulation toolkit, from conda-forge's geant4 (EIC eAST fork on the eic label)"
  description: |
    The default hep-forge "geant" installs conda-forge's geant4 of the same
    version. The EIC fork (github.com/eic/geant4, vanilla Geant4 plus the
    eASTPhysicsList) is built from this feedstock's eic branch and published
    on the eic label: conda install -c hep-forge/label/eic geant

extra:
  recipe-maintainers:
    - meiyasan
