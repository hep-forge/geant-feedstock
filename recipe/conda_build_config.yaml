# Used by Geant3 only (compiled); Geant4 points at conda-forge's geant4.
c_stdlib:
  - sysroot                    # [linux]
c_stdlib_version:
  - 2.17                       # [linux]

# conda-forge's root_base: the ROOT minor, its C++ variant and its Python
# (root_base is built once per Python).
root:
  - 6.38
root_cxx_standard:
  - 23
python:
  - "3.12"

# GCC 16: conda-forge's root_base is built with it.
c_compiler_version:          # [linux]
  - 16                       # [linux]
cxx_compiler_version:        # [linux]
  - 16                       # [linux]
fortran_compiler_version:    # [linux]
  - 16                       # [linux]
